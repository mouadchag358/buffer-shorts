name: Add eight Facebook quizzes every twelve hours
on:
  push:
    paths:
      - '.github/workflows/pop-culture-images.yml'
      - 'scripts/render_pop_culture.py'
      - 'scripts/render_approved_quizzes.py'
      - 'pop-culture/reference-artwork.jpg'
      - 'pop-culture/cards/*.jpg'
      - 'pop-culture/cards/*.svg'
      - 'pop-culture/questions.json'
      - 'src/pop-culture-images.js'
      - 'src/quiz-alternation.js'
      - 'src/migrate-quiz-alternation.js'
      - 'test/pop-culture.test.js'
      - 'src/refresh-facebook-quiz-media.js'
      - 'src/inspect-facebook-buffer.js'
      - 'test/refresh-facebook-quiz-media.test.js'
      - 'pop-culture/redesigned.json'
  schedule:
    - cron: '33 0,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test only, do not schedule posts
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: buffer-shorts
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
      PERSIST_GIT: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Install Python and render original images if missing
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize and commit quiz cards (approved artwork)
        if: ${{ github.event_name == 'push' }}
        run: |
          python -m pip install --disable-pip-version-check CairoSVG==2.8.2 Pillow==11.3.0
          python scripts/render_approved_quizzes.py --reactions-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pop-culture/cards/quiz-*.jpg
          git diff --cached --quiet || (git commit -m 'Add all 100 approved illustrated quiz JPG cards [skip ci]' && git push origin HEAD)
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Configure Git checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Alternate reaction quizzes with existing letter quizzes
        run: |
          if [ '${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}' = 'true' ]; then
            node src/migrate-quiz-alternation.js --dry-run
          else
            node src/migrate-quiz-alternation.js
          fi
      - name: Schedule the next batch of eight Facebook quizzes
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node src/pop-culture-images.js --dry-run
          else
            node src/pop-culture-images.js
          fi
