name: Replace Facebook Reels With Pop Culture Images
on:
  push:
    paths:
      - '.github/workflows/pop-culture-images.yml'
      - 'scripts/render_pop_culture.py'
      - 'pop-culture/cards/*.svg'
      - 'pop-culture/questions.json'
      - 'src/pop-culture-images.js'
      - 'test/pop-culture.test.js'
  schedule:
    - cron: '33 0,5,10,15,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test only, do not schedule posts
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: buffer-shorts
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
      PERSIST_GIT: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Install Python and render original images if missing
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize and commit 10 redesigned English quiz cards
        if: ${{ hashFiles('pop-culture/cards/*.png') == '' }}
        run: |
          python -m pip install --disable-pip-version-check CairoSVG==2.8.2
          python scripts/render_pop_culture.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pop-culture/cards/*.png
          git diff --cached --quiet || (git commit -m 'Add 100 ready-to-post pop culture PNG cards [skip ci]' && git push origin HEAD)
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Configure Git checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Replace eight existing Facebook Reels without creating extra posts
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node src/pop-culture-images.js --dry-run
          else
            node src/pop-culture-images.js
          fi
