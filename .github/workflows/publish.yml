name: Envoyer les Shorts à Buffer
on:
  push:
    paths: ['.github/workflows/publish.yml']
  schedule:
    - cron: '17 10,20 * * *'
      timezone: 'Africa/Casablanca'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Simulation sans envoi
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: buffer-shorts
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ vars.BUFFER_YOUTUBE_CHANNEL_ID }}
      BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
      BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || secrets.R2_PUBLIC_BASE_URL || 'https://pub-30699360814641ee9a2e9e457cd4cc78.r2.dev' }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || '26f5f1d1273dff54524414e342225b93' }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'reels' }}
      R2_PREFIX: ${{ vars.R2_PREFIX }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      PERSIST_GIT: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Configurer les checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Envoyer ou simuler
        env:
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run dry-run
          else
            npm start
          fi
