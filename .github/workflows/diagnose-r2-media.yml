name: Diagnostic lecture seule vidéo R2 refusée
on:
  push:
    paths:
      - '.github/workflows/diagnose-r2-media.yml'
      - '.github/requests/diagnose-r2.json'
permissions:
  contents: read
concurrency:
  group: r2-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect-video:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-30699360814641ee9a2e9e457cd4cc78.r2.dev' }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || '26f5f1d1273dff54524414e342225b93' }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'reels' }}
      R2_PREFIX: ${{ vars.R2_PREFIX }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Télécharger et inspecter uniquement la vidéo R2 ciblée
        run: node src/diagnose-r2-file.js
